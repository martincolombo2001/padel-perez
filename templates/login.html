<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Padel Pérez</title>
    <style>
        body { background-color: #000932; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: white; padding: 40px; border-radius: 12px; text-align: center; max-width: 350px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        h2 { color: #000932; margin-bottom: 20px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; background-color: #93b625; color: #000932; padding: 12px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 15px; transition: background 0.3s; text-transform: uppercase; }
        button:hover { background-color: #003383; color: white; }
        .error { color: #f8111c; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Acceso Restringido</h2>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required autocomplete="off">
            <input type="password" name="clave" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
